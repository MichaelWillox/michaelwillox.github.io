  - id: lafrance-cooke-macdonald-willox-2020
    type: report
    authors: ["Lafrance-Cooke, Amélie", "Macdonald, Ryan", "Willox, Michael"]
    year: 2020
    title: "Monthly Business Openings and Closures: Experimental Series for Canada, the Provinces and Territories, and Census Metropolitan Areas"
    venue: "Economic Insights"
    number: "No. 116, Catalogue no. 11-626-X"
    publisher: "Statistics Canada"
    url: "https://www150.statcan.gc.ca/n1/pub/11-626-x/11-626-x2020014-eng.htm"
    abstract: >-
      This article in the Economic Insights series presents monthly estimates of
      the number of business openings and closing, continuing businesses, and
      active businesses from January 2015 to April 2020. The estimates for
      businesses with employees are available for Canada, the provinces and
      territories, and census metropolitan areas. Where possible, industry
      information based on two-digit North American Industry Classification
      Systems codes are also presented. A business closing is defined as a firm
      that had employment in the previous month, but no employment in the
      current month. The closure may be temporary or permanent. Since January
      2015, an average of approximately 39,000 businesses have closed each month
      in the Canadian business sector. More than twice that number, 88,187, was
      observed in April 2020.

  - id: gu-hussain-willox-2019
    type: report
    authors: ["Gu, Wulong", "Hussain, Jakir", "Willox, Michael"]
    year: 2019
    title: "Environmentally Adjusted Multifactor Productivity Growth for the Canadian Manufacturing Sector"
    venue: "Analytical Studies Branch Research Paper Series"
    number: "No. 425, Catalogue no. 11F0019M"   # number from Michael's 2026 BoC resume
    publisher: "Statistics Canada"
    url: "https://www150.statcan.gc.ca/n1/pub/11f0019m/11f0019m2019013-eng.htm"
    abstract: >-
      The need to measure both the desirable outputs (goods and services) and
      the undesirable outputs (emissions of greenhouse gases [GHGs] and criteria
      air contaminants [CACs]) from economic activity is becoming increasingly
      important as economic performance and environmental performance become
      ever more intertwined. Standard measures of multifactor productivity (MFP)
      growth provide insights into rising standards of living and the
      performance of economies, but they may be misleading if only desirable
      outputs are considered. This study presents estimates of environmentally
      adjusted multifactor productivity (EAMFP) growth using a new comprehensive
      database. This database contains information on GHG and CAC emissions, as
      well as on the production activities of Canadian manufacturers. Overall,
      the results indicate that EAMFP growth was higher than MFP growth, largely
      reflecting declines in the undesirable output emissions intensity, in the
      manufacturing sector from 2004 to 2012.

