# ---------------------------------------------------------------------------
# Single source for every publication on the site.
#
# Both pages/research.qmd (with abstracts) and pages/CV.qmd (citations only,
# also rendered to pages/CV.pdf) read this file through the {{< publications >}}
# shortcode in _extensions/publications/. No R is needed. To add a paper, copy an
# entry, fill it in, and re-render the site. Nothing else needs editing.
#
# Fields
#   id        short unique key (any text)
#   type      journal | report | working | phd   (decides the section)
#   authors   list of "Family, Given" in publication order
#   year      year, or "forthcoming" / "in progress"
#   title     title in sentence or title case, as published
#   venue     journal or series name (shown in italics)
#   volume, issue, pages, number   optional
#   publisher optional (e.g. Statistics Canada)
#   url       main link (DOI preferred)
#   ungated   optional free-to-read link
#   abstract  optional; shown on the Research page only
#   note      optional short note shown after the citation
#   draft     true hides the entry everywhere until it is ready
#
# Keep every entry indented under `publications:`.
# Entries are sorted newest first within each section automatically.
# ---------------------------------------------------------------------------

publications:

# ===== Peer-reviewed journal articles ======================================

  - id: gu-willox-2023
    type: journal
    authors: ["Gu, Wulong", "Willox, Michael"]
    year: 2023
    title: "The Post-2001 Productivity Growth Divergence between Canada and the United States"
    venue: "International Productivity Monitor"
    volume: 45
    pages: "28-60"   # Michael confirmed 28-60 (2026-11-22); his BoC resume says 27-60
    url: "http://csls.ca/ipm/45/IPM_45_Gu.pdf"
    abstract: >-
      The high degree of integration between the Canadian and the US economies
      promotes sharing of technologies and innovation spillovers that are
      conducive to long-term productivity growth convergence. However, since 2001
      labour productivity growth rates have diverged in sharp contrast to the
      previous four decades. A comparison of labour productivity growth
      decomposed into contributions by industry for both countries reveals that
      the information and cultural services industry has played an outsized role
      in the divergence, the start of which coincides with the dot-com recession
      of the early 2000s. Limits on foreign investment, most notably but not
      exclusively related to telecommunications, and strong output price growth
      relative to the United States are key factors for undertaking a simple
      counterfactual analysis to evaluate the role of competitive intensity in
      the information and cultural services industry. Estimates of markups and
      their impact on labour productivity growth suggest that limited competition
      has significantly reduced the productivity performance of that industry as
      well as the performances of others that are dependent on its services as
      intermediate inputs.

  - id: kumbhakar-badunenko-willox-2022
    type: journal
    authors: ["Kumbhakar, Subal C.", "Badunenko, Oleg", "Willox, Michael"]
    year: 2022
    title: "Do carbon taxes affect economic and environmental efficiency? The case of British Columbia's manufacturing plants"
    venue: "Energy Economics"
    volume: 115
    number: "106359"
    url: "https://doi.org/10.1016/j.eneco.2022.106359"
    ungated: "https://mpra.ub.uni-muenchen.de/118907/1/MPRA_paper_118907.pdf"
    note: "A corrigendum appeared in Energy Economics, vol. 144 (2025)."
    abstract: >-
      This paper evaluates the impact of British Columbia's carbon tax on
      manufacturers' economic and environmental performance in a unified
      modeling framework that allows for a critical distinction between
      efficiency, technical change, and total factor productivity as performance
      measures. In contrast to most papers that examine environmental policy
      impacts on either the economy or the environment, our approach combines a
      by-production model within a stochastic frontier framework to evaluate the
      tax's impacts on both economic and environmental efficiency. Our findings
      suggest that a 1.0% increase in the carbon tax improved manufacturers'
      efficiency in producing desirable output (real sales of manufactured goods)
      by 0.5%. In addition, the same 1.0% increase in the carbon tax improved
      manufacturers' environmental efficiency for greenhouse gas (GHGs) and
      carbon monoxide (CO) emissions by the same amount, 0.2%. However, the
      carbon tax led to lower environmental efficiency for emissions of nitrogen
      oxides (NO~X~), −0.3%. In addition, our use of a rich plant-level dataset
      reveals considerable heterogeneity in manufacturers' efficiency responses
      to the tax. Finally, we suggest that lower efficiency levels for
      undesirable outputs than desirable outputs indicate that the relative cost
      of adjusting production processes to improve efficiency favors economic
      efficiency over environmental efficiency.

  - id: gu-willox-2018
    type: journal
    authors: ["Gu, Wulong", "Willox, Michael"]
    year: 2018
    title: "Productivity Growth in Canada and the United States: Recent Industry Trends and Potential Explanations"
    venue: "International Productivity Monitor"
    volume: 35
    pages: "73-94"
    url: "https://www.csls.ca/ipm/35/Gu-Willox.pdf"
    abstract: >-
      Labour productivity growth in Canada was weaker than that in the United
      States from the mid-1980s to 2010, leading to a decline in Canada's
      relative productivity level. This situation was mainly due to the lower
      multifactor productivity (MFP) growth experienced in most Canadian
      industries in that period. After 2010, however, the pattern reversed
      itself as labour productivity growth in Canada exceeded that of the United
      States. Higher labour productivity growth in Canada for the 2010-2014
      period was due to a relatively larger capital deepening effect and
      relatively higher MFP growth. Both these developments were associated with
      stronger output growth and stronger demand in Canada. In addition, the
      contributions of ICT producing and ICT intensive using industries to U.S.
      labour productivity growth waned after 2010. For Canada, ICT producing
      industries contributed little to overall labour productivity before and
      after 2010, while ICT intensive using industries exhibited stronger
      productivity growth after 2010. The latter may reflect the more moderate
      ICT investment in Canada compared to the United States in the 1990s and
      early 2000s and the more gradual realization of benefits of ICT usage.

  - id: baldwin-willox-2016
    type: journal
    authors: ["Baldwin, John R.", "Willox, Michael"]
    year: 2016
    title: "The Industry Origins of Canada's Weaker Labour Productivity Performance and the Role of Structural Adjustment in the Post-2000 Period"
    venue: "International Productivity Monitor"
    volume: 31
    pages: "19-36"   # from Michael's 2026 BoC resume
    url: "https://www.csls.ca/ipm/31/baldwin.pdf"
    abstract: >-
      This article examines how much of the slowdown in labour productivity
      growth observed in Canada's business sector after 2000 was due to weaker
      productivity growth within industries and how much was due to structural
      adjustment. The analysis makes use of a decomposition method that differs
      from many of the standard decomposition approaches commonly found in the
      literature and allows for the contributions of changes in the importance
      of individual industries to be calculated. The approach reveals that the
      post-2000 slowdown was attributable entirely to weaker productivity growth
      within industries and that structural adjustment had a slight mitigating
      effect on the slowdown. Lower productivity growth within three industries
      (manufacturing; finance, insurance and real estate; and mining, oil and
      gas) accounted for all of the slowdown in business sector labour
      productivity growth in the 2000s.

